<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Production Workflow – Sign in</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  body{margin:0;background:#f2f4f8;font-family:"Segoe UI",Roboto,Arial,sans-serif;color:#1c2333}
  .card{max-width:420px;margin:12vh auto 0;background:#fff;border:1px solid #dde2ec;border-radius:16px;
    padding:28px 24px;text-align:center;box-shadow:0 4px 16px rgba(20,30,60,.08)}
  .tag{font-size:12px;letter-spacing:1.5px;color:#566079;font-weight:700}
  h1{margin:6px 0 8px;font-size:24px;color:#1f2d4d}
  p{color:#566079;font-size:15px;margin:0 0 20px}
  #gBtn{display:flex;justify-content:center;min-height:44px}
  #msg{margin-top:16px;font-weight:600;font-size:14px;min-height:20px}
  .err{color:#b3261e}
  a.open{display:inline-block;margin-top:14px;color:#1a56a8;font-weight:700}
</style>
</head>
<body>
<div class="card">
  <div class="tag">AVON · EUME</div>
  <h1>Production Workflow</h1>
  <p>Sign in with your company Google account.<br>This device will stay logged in.</p>
  <div id="gBtn"></div>
  <div id="msg"></div>
</div>

<script>
/* ===================== EDIT THESE TWO LINES ===================== */
const APP_URL   = 'https://script.google.com/macros/s/AKfycbzOMr6DBPuQ_-AxRZ76c430IiwACeVxU0yiAq2KP77fjlenglmF17DaM7G-W30biJ-0/exec';
const CLIENT_ID = '407495392214-3r5jrslcv3hh1l6002pa98s7c5cl8p2h.apps.googleusercontent.com';
/* ================================================================ */

const $ = id => document.getElementById(id);

// Hand Google's sign-in proof to the Apps Script app (it checks the email against USERS)
function onGoogleCredential(resp){
  $('msg').textContent = 'Opening the Production app…';
  window.location.href = APP_URL + '?old=1&g=' + encodeURIComponent(resp.credential);
}

function init(){
  if (!window.google || !google.accounts || !google.accounts.id) { setTimeout(init, 300); return; }
  google.accounts.id.initialize({
    client_id: CLIENT_ID,
    callback: onGoogleCredential,
    auto_select: false,
    cancel_on_tap_outside: true
  });
  google.accounts.id.renderButton($('gBtn'), {
    theme: 'filled_blue', size: 'large', shape: 'pill', text: 'signin_with', width: 280
  });
}
init();
</script>
</body>
</html>
