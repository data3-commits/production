<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Production Workflow – Sign in</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  body{margin:0;font-family:"Segoe UI",Roboto,Arial,sans-serif;background:#f2f4f8;color:#1c2333}
  .card{max-width:420px;margin:12vh auto 0;background:#fff;border:1px solid #dde2ec;border-radius:16px;
        padding:28px 24px;text-align:center;box-shadow:0 4px 16px rgba(20,30,60,.08)}
  h1{margin:0 0 8px;font-size:24px;color:#1f2d4d}
  p{color:#566079;font-size:15px;margin:0 0 20px}
  #btn{display:flex;justify-content:center;min-height:46px}
  #msg{margin-top:14px;font-size:14px;font-weight:600;color:#1f2d4d}
</style>
</head>
<body>
  <div class="card">
    <h1>Production Workflow</h1>
    <p>Sign in with your company Google account.</p>
    <div id="btn"></div>
    <div id="msg"></div>
  </div>

<script>
  /* ====== EDIT THESE TWO LINES ====== */
  const CLIENT_ID = '407495392214-3r5jrslcv3hh1l6002pa98s7c5cl8p2h.apps.googleusercontent.com';
  const APP_URL   = 'https://script.google.com/macros/s/AKfycbyOUziWbxYhdUQptNxkn5R-b7yBBKoZ4X-kOo2gjkcwIm-77jnYPMCpf8paMXFugp5F/exec';
  /* ================================== */

  function onSignedIn(resp) {
    document.getElementById('msg').textContent = 'Signed in. Opening the app…';
    // send Google's sign-in proof to the app; the app checks the email against its user list
    window.location.href = APP_URL + '?g=' + encodeURIComponent(resp.credential);
  }

  window.onload = function () {
    google.accounts.id.initialize({
      client_id: CLIENT_ID,
      callback: onSignedIn,
      auto_select: false
    });
    google.accounts.id.renderButton(document.getElementById('btn'), {
      theme: 'filled_blue', size: 'large', shape: 'pill', text: 'signin_with', width: 280
    });
  };
</script>
</body>
</html>
